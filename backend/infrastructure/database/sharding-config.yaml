# Database Sharding Configuration
# This is a conceptual configuration for horizontal sharding.
# For PostgreSQL, you might use Citus extension or application-level sharding.
# For Supabase, consider using partitions within a single database or multiple projects.

# Example for application-level sharding (e.g., using a proxy like Vitess, or custom logic)
shards:
  - id: 0
    name: shard-0
    host: shard0.db.example.com
    port: 5432
    database: aimetafactory
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    weight: 40
    regions: ["us-east-1", "us-west-2"]
    read_replicas:
      - host: replica0-1.db.example.com
        port: 5432
      - host: replica0-2.db.example.com
        port: 5432

  - id: 1
    name: shard-1
    host: shard1.db.example.com
    port: 5432
    database: aimetafactory
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    weight: 30
    regions: ["eu-west-1"]
    read_replicas:
      - host: replica1-1.db.example.com
        port: 5432

  - id: 2
    name: shard-2
    host: shard2.db.example.com
    port: 5432
    database: aimetafactory
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    weight: 30
    regions: ["ap-southeast-1"]
    read_replicas: []

# Sharding strategy
strategy:
  # Shard key: the column used to distribute data (e.g., user_id, project_id)
  shard_key: user_id
  # Algorithm: "hash" or "range"
  algorithm: hash
  # Number of virtual shards (pre-sharding)
  virtual_shards: 128
  # Mapping from virtual shard to physical shard (for consistent hashing)
  # This would be generated by a control plane; here we just show an example.
  mapping:
    - virtual: 0-31
      shard: 0
    - virtual: 32-63
      shard: 1
    - virtual: 64-95
      shard: 2
    - virtual: 96-127
      shard: 0  # can have uneven distribution for weighted shards

# Connection pooling
pool:
  max_connections_per_shard: 50
  min_connections: 10
  idle_timeout: 60000
  connection_timeout: 5000

# Backup and monitoring
backup:
  enabled: true
  schedule: "0 2 * * *"
  retention_days: 30

monitoring:
  metrics_port: 9187
  slow_query_threshold: 1000  # ms

# Notes:
# - For Citus, you would use the coordinator node with distributed tables.
# - For application-level sharding, you would implement a routing layer.
# - This configuration is meant to be loaded by a custom sharding router.
