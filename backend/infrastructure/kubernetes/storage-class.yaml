# StorageClass for dynamic volume provisioning
# This is an example for AWS. Adapt for your cloud provider.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast
provisioner: kubernetes.io/aws-ebs
parameters:
  type: gp2
  fsType: ext4
  encrypted: "true"
---
# For GCP (uncomment and adapt)
