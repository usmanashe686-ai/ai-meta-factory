# WARNING: This file contains example secrets with placeholder values.
# Never commit actual secrets to version control.
# Use `kubectl create secret generic` or tools like SealedSecrets, External Secrets in production.
# To generate base64 of a value: echo -n 'your-value' | base64

---
# Database credentials (used by postgres-statefulset)
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: ai-meta-factory
type: Opaque
data:
  # echo -n 'postgrespassword' | base64 -> cG9zdGdyZXNwYXNzd29yZA==
  postgres-password: cG9zdGdyZXNwYXNzd29yZA==  # CHANGE THIS

---
# Redis password
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: ai-meta-factory
type: Opaque
data:
  # echo -n 'redispassword' | base64 -> cmVkaXNwYXNzd29yZA==
  redis-password: cmVkaXNwYXNzd29yZA==  # CHANGE THIS

---
# JWT secret for authentication (used by auth-service)
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: ai-meta-factory
type: Opaque
data:
  # Generate a strong random key: openssl rand -base64 32 | base64
  secret: c29tZS1yYW5kb20tc2VjcmV0LWtleS1mb3Itand0Cg==  # CHANGE THIS

---
# API keys for external services (GitHub OAuth, Stripe, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: api-keys
  namespace: ai-meta-factory
type: Opaque
data:
  github-client-id: ""      # base64 of your GitHub OAuth client ID
  github-client-secret: ""  # base64 of your GitHub OAuth secret
  stripe-secret-key: ""     # base64 of your Stripe secret key

---
# Full DATABASE_URL for the API gateway (optional – if not constructing from parts)
apiVersion: v1
kind: Secret
metadata:
  name: db-url-secret
  namespace: ai-meta-factory
type: Opaque
data:
  # Example: postgresql://postgres:postgrespassword@postgres-service:5432/aimetafactory?sslmode=disable
  database-url: cG9zdGdyZXNxbDovL3Bvc3RncmVzOnBvc3RncmVzcGFzc3dvcmRAcG9zdGdyZXMtc2VydmljZTo1NDMyL2FpbWV0YWZhY3Rvcnk/c3NsbW9kZT1kaXNhYmxlCg==  # CHANGE THIS
