apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-meta-factory-config
  namespace: ai-meta-factory
data:
  # Database
  DATABASE_URL: "postgresql://postgres:password@postgres-service:5432/aimetafactory?sslmode=disable"
  # Service URLs (internal Kubernetes DNS)
  AUTH_SERVICE_URL: "http://auth-service:3002"
  PROJECT_SERVICE_URL: "http://project-service:3003"
  BUILD_SERVICE_URL: "http://build-service:8080"
  AI_SERVICE_URL: "http://ai-service:8000"
  REALTIME_SERVICE_URL: "http://realtime-service:3004"
  EMAIL_SERVICE_URL: "http://email-service:3005"
  NOTIFICATION_SERVICE_URL: "http://notification-service:3006"
  # Frontend URL (for CORS)
  FRONTEND_URL: "https://ai-meta-factory.vercel.app"
  # Log level
  LOG_LEVEL: "info"
  # Redis
  REDIS_URL: "redis://redis-service:6379"
  # Other settings
  NODE_ENV: "production"
