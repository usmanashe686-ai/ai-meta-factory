# PersistentVolumeClaim for AI models (used by ai-service)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-models-pvc
  namespace: ai-meta-factory
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast  # reference the StorageClass above
  resources:
    requests:
      storage: 20Gi
---
