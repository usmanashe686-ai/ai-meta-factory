name: Build Android APK (V4 Ultimate)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build & Export Next.js
        run: |
          npm run build
          # No 'npx cap export' needed if you use 'output: export' in next.config.js
          ls -R out/

      - name: Prepare Capacitor Android
        run: |
          # Force clean platform addition to avoid "platform not added" error
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Inject Native Engine & Styles
        run: |
          TARGET_DIR="android/app/src/main/java/com/aimetafactory/app"
          mkdir -p $TARGET_DIR
          
          # 1. Inject all V4 Java classes (Engine + Plugin + MainActivity)
          cp -r native-backups/android/com/aimetafactory/app/* $TARGET_DIR/
          
          # 2. Inject Styles (Fixes Black Bars)
          mkdir -p android/app/src/main/res/values/
          cp native-backups/android/res/values/styles.xml android/app/src/main/res/values/styles.xml || echo "Styles missing"

          # 3. Inject Gradle Dependencies (WorkManager & OkHttp)
          if ! grep -q "androidx.work" android/app/build.gradle; then
            sed -i '/dependencies {/a \    implementation "androidx.work:work-runtime:2.9.0"\n    implementation "com.squareup.okhttp3:okhttp:4.12.0"' android/app/build.gradle
          fi

          # 4. Register Manifest Components
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />' $MANIFEST
          sed -i '/<\/application>/i \    <service android:name=".DownloadService" android:foregroundServiceType="dataSync" android:exported="false" />' $MANIFEST

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Meta-Factory-V4-Ultimate
          path: android/app/build/outputs/apk/debug/app-debug.apk
