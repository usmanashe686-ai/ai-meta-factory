name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Build Next.js
        run: npm run build

      - name: Sync Capacitor
        run: npx cap add android || npx cap sync android

      - name: Inject Production Bridge
        run: |
          # Create the correct package directory
          mkdir -p android/app/src/main/java/com/aimetafactory/app/
          
          # Move all native files (Plugin, Service, MainActivity) into the root package
          cp native-backups/android/*.java android/app/src/main/java/com/aimetafactory/app/
          
          # Register the Background Service in the Manifest automatically
          sed -i '/<\/application>/i \    <service android:name=".DownloadService" android:foregroundServiceType="dataSync" android:exported="false" />' android/app/src/main/AndroidManifest.xml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Meta-Factory-v3
          path: android/app/build/outputs/apk/debug/app-debug.apk
