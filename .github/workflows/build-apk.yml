name: Build Android APK (V4 Ultimate)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js
        run: npm run build

      - name: Sync Capacitor
        run: npx cap add android || npx cap sync android

      - name: Inject Native Engine & Dependencies
        run: |
          # 1. Inject Java files from native-backups
          mkdir -p android/app/src/main/java/com/aimetafactory/app/
          cp -r native-backups/android/com/aimetafactory/app/* android/app/src/main/java/com/aimetafactory/app/
          
          # 2. Inject Gradle Dependencies (WorkManager & OkHttp)
          sed -i '/dependencies {/a \    implementation "androidx.work:work-runtime:2.9.0"\n    implementation "com.squareup.okhttp3:okhttp:4.12.0"' android/app/build.gradle
          
          # 3. Register Manifest Components
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />' $MANIFEST
          sed -i '/<\/application>/i \    <service android:name="androidx.work.impl.background.systemjob.SystemJobService" android:permission="android.permission.BIND_JOB_SERVICE" android:exported="true" />\n    <service android:name=".DownloadService" android:foregroundServiceType="dataSync" android:exported="false" />' $MANIFEST

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Meta-Factory-V4
          path: android/app/build/outputs/apk/debug/app-debug.apk
