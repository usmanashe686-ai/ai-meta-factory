name: Build Android APK (V4 Ultimate)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js
        run: npm run build

      - name: Force Capacitor Android
        run: |
          # We don't check, we just BUILD.
          npx cap add android
          npx cap sync android

      - name: Inject Native Engine & Sync
        run: |
          TARGET_DIR="android/app/src/main/java/com/aimetafactory/app"
          mkdir -p $TARGET_DIR
          
          # Inject V4 Java classes
          cp -r native-backups/android/com/aimetafactory/app/* $TARGET_DIR/
          
          # Inject Styles (Fixes Black Bars/Keyboard bug)
          mkdir -p android/app/src/main/res/values/
          cp native-backups/android/res/values/styles.xml android/app/src/main/res/values/styles.xml || echo "Styles missing"

          # Register Manifest Components
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />' $MANIFEST
          sed -i '/<\/application>/i \    <service android:name=".DownloadService" android:foregroundServiceType="dataSync" android:exported="false" />' $MANIFEST

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Meta-Factory-V4-Ultimate
          path: android/app/build/outputs/apk/debug/app-debug.apk
