name: Build Android APK (V4 Ultimate)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build & Export Next.js
        run: |
          npm run build
          # Ensure Capacitor sees the 'out' directory
          mkdir -p out
          ls -la out/

      - name: Initialize & Add Android (Clean Build)
        run: |
          # 1. Force Capacitor to see the config
          test -f capacitor.config.ts || npx cap init "AI Meta Factory" "com.aimetafactory.app" --web-dir=out
          
          # 2. Delete any ghost folder and ADD it fresh
          rm -rf android
          npx cap add android
          
          # 3. Sync the web assets
          npx cap sync android

      - name: Inject V4 Native Engine
        run: |
          TARGET_DIR="android/app/src/main/java/com/aimetafactory/app"
          mkdir -p $TARGET_DIR
          cp -r native-backups/android/com/aimetafactory/app/* $TARGET_DIR/
          
          # Inject Styles (Fixes the Black Bars/Keyboard bug)
          mkdir -p android/app/src/main/res/values/
          cp native-backups/android/res/values/styles.xml android/app/src/main/res/values/styles.xml || echo "No styles found"
          
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />' $MANIFEST
          sed -i '/<\/application>/i \    <service android:name=".DownloadService" android:foregroundServiceType="dataSync" android:exported="false" />' $MANIFEST

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Meta-Factory-V4-Build-200
          path: android/app/build/outputs/apk/debug/app-debug.apk
