name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --legacy-peer-deps --no-audit
      - run: npm run lint
      - run: npm run typecheck
        continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --legacy-peer-deps --no-audit
      - run: npm test -- --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --legacy-peer-deps --no-audit
      - run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: .next
          retention-days: 5

  optimize:
    name: Optimize & Analyze
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --legacy-peer-deps --no-audit
      - name: Install optimization tools
        run: |
          npm install --legacy-peer-deps --no-audit -g @next/bundle-analyzer
          npm install --legacy-peer-deps --no-audit sharp postcss cssnano terser --no-save
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: .next
      - name: Run bundle analysis
        run: npx @next/bundle-analyzer .next/server/chunks/*.js --json > bundle-stats.json
      - name: Upload bundle stats
        uses: actions/upload-artifact@v4
        with:
          name: bundle-stats
          path: bundle-stats.json
      - name: Run image optimization (if any)
        run: |
          if [ -f "backend/services/export-service/src/optimizer.js" ]; then
            node backend/services/export-service/src/optimizer.js
          else
            echo "Optimizer script not found, skipping."
          fi
