name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Build Next.js static export
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_FLASK_URL: ${{ secrets.NEXT_PUBLIC_FLASK_URL }}
          NEXT_PUBLIC_BUILD_SERVICE_URL: ${{ secrets.NEXT_PUBLIC_BUILD_SERVICE_URL }}
          NEXT_PUBLIC_REAL_TIME_URL: ${{ secrets.NEXT_PUBLIC_REAL_TIME_URL }}
          NEXT_AUTH_URL: ${{ secrets.NEXT_AUTH_URL }}
        run: npm run build

      - name: Init & Add Android
        run: |
          npx cap init "AI Meta Factory" "com.aimetafactory.app2" --web-dir=out || true
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Force ARM64 ABI
        run: echo "android.defaultConfig.ndk.abiFilters=arm64-v8a" >> android/gradle.properties

      - name: Clone llama.cpp
        run: git clone --depth 1 https://github.com/ggerganov/llama.cpp android/llama.cpp

      - name: Restore native files and clean manifest
        run: |
          mkdir -p android/app/src/main/cpp
          cp -r native/android/cpp/* android/app/src/main/cpp/
          mkdir -p android/app/src/main/java/com/aimetafactory/llama
          cp -r native/android/java/com/aimetafactory/llama/* android/app/src/main/java/com/aimetafactory/llama/
          mkdir -p android/app/src/main/assets
          cp native/android/assets/capacitor.plugins.json android/app/src/main/assets/ 2>/dev/null || true
          mkdir -p android/app/src/main/java/com/aimetafactory/app
          cp native/android/MainActivity.patch android/app/src/main/java/com/aimetafactory/app/MainActivity.java
          # Replace AndroidManifest.xml with clean template
          cp native/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          echo "Native files restored and manifest replaced"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Build native library (manual CMake with llama.cpp)
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          cd android/app/src/main/cpp
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          mkdir -p $GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a
          find . -name "*.so" -exec cp {} $GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/ \;
          echo "✅ All native libraries copied to jniLibs"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build debug APK (signed with debug key)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK contains native library
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            echo "APK size: $(du -h $APK)"
            unzip -l $APK | grep '\.so$' && echo "✅ Native libraries present" || { echo "❌ Missing native libraries"; exit 1; }
          else
            echo "APK not found at $APK"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Meta-Factory-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
