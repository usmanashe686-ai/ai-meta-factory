name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Build Next.js static export
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_FLASK_URL: ${{ secrets.NEXT_PUBLIC_FLASK_URL }}
          NEXT_PUBLIC_BUILD_SERVICE_URL: ${{ secrets.NEXT_PUBLIC_BUILD_SERVICE_URL }}
          NEXT_PUBLIC_REAL_TIME_URL: ${{ secrets.NEXT_PUBLIC_REAL_TIME_URL }}
          NEXT_AUTH_URL: ${{ secrets.NEXT_AUTH_URL }}
        run: npm run build

      # ========== REPAIR CSS (fix UI layout) ==========
      - name: Repair CSS (copy source CSS to out folder)
        run: |
          mkdir -p out/css
          cp app/globals.css out/css/globals.css
          find . -name "*.css" -path "./out/*" -exec rm {} \;
          npx tailwindcss -i app/globals.css -o out/css/tailwind.css --minify
          echo "✅ CSS repaired"

      # ========== FIX CHAT INPUT VISIBILITY ==========
      - name: Fix chat input visibility (inject CSS)
        run: |
          CSS_FILE=$(find out -name "*.css" | head -1)
          if [ -f "$CSS_FILE" ]; then
            cat >> "$CSS_FILE" << 'CSSEOF'

/* Force chat input to be visible and usable */
.chat-input-container, 
.message-input, 
textarea, 
[contenteditable="true"],
.input-area,
.fixed-bottom {
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
    background: #1e1e2f !important;
    color: white !important;
    border: 1px solid #4a4a6a !important;
    border-radius: 12px !important;
    padding: 12px !important;
    margin: 8px !important;
    width: calc(100% - 24px) !important;
    min-height: 48px !important;
    position: relative !important;
    z-index: 10000 !important;
}
.send-button, 
button[type="submit"] {
    display: inline-block !important;
    background: #4f46e5 !important;
    color: white !important;
    padding: 8px 16px !important;
    border-radius: 20px !important;
    margin-left: 8px !important;
}
CSSEOF
            echo "✅ CSS fix injected"
          else
            echo "❌ No CSS file found"
          fi

      - name: Init & Add Android
        run: |
          npx cap init "AI Meta Factory" "com.aimetafactory.app2" --web-dir=out || true
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Clone llama.cpp (full clone, checkout tag b3420)
        run: |
          git clone https://github.com/ggerganov/llama.cpp android/llama.cpp
          cd android/llama.cpp
          git fetch --tags
          git checkout tags/b3420

      - name: Verify llama.cpp clone
        run: |
          if [ -f "android/llama.cpp/CMakeLists.txt" ]; then
            echo "✅ llama.cpp cloned"
          else
            exit 1
          fi

      - name: Restore native files and clean manifest
        run: |
          mkdir -p android/app/src/main/cpp
          cp -r native/android/cpp/* android/app/src/main/cpp/
          mkdir -p android/app/src/main/java/com/aimetafactory/llama
          cp -r native/android/java/com/aimetafactory/llama/* android/app/src/main/java/com/aimetafactory/llama/
          mkdir -p android/app/src/main/assets
          cp native/android/assets/capacitor.plugins.json android/app/src/main/assets/ 2>/dev/null || true
          mkdir -p android/app/src/main/java/com/aimetafactory/app
          cp native/android/MainActivity.patch android/app/src/main/java/com/aimetafactory/app/MainActivity.java
          cp native/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          echo "Native files restored"

      - name: Fix AndroidManifest permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "INTERNET" $MANIFEST || sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' $MANIFEST
          grep -q "FOREGROUND_SERVICE" $MANIFEST || sed -i '/<manifest/a \    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />' $MANIFEST
          grep -q "WRITE_EXTERNAL_STORAGE" $MANIFEST || sed -i '/<manifest/a \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' $MANIFEST

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Build native library for both ABIs
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          mkdir -p $GITHUB_WORKSPACE/android/app/src/main/jniLibs
          for ABI in armeabi-v7a arm64-v8a; do
            echo "Building for $ABI"
            cd $GITHUB_WORKSPACE/android/app/src/main/cpp
            rm -rf build
            mkdir build && cd build
            cmake .. \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release \
              -DLLAMA_BUILD_EXAMPLES=OFF \
              -DLLAMA_BUILD_SERVER=OFF \
              -DLLAMA_BUILD_TESTS=OFF \
              -DLLAMA_BUILD_COMMON=OFF
            make llama -j$(nproc)
            mkdir -p $GITHUB_WORKSPACE/android/app/src/main/jniLibs/$ABI
            find . -name "*.so" -exec cp {} $GITHUB_WORKSPACE/android/app/src/main/jniLibs/$ABI/ \;
            echo "✅ $ABI libraries copied"
          done

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build universal APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK contains native libraries
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            echo "APK size: $(du -h $APK)"
            unzip -l $APK | grep '\.so$' && echo "✅ Native libraries present"
          else
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Meta-Factory-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
