name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and Debug Next.js Export
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_FLASK_URL: ${{ secrets.NEXT_PUBLIC_FLASK_URL }}
          NEXT_PUBLIC_BUILD_SERVICE_URL: ${{ secrets.NEXT_PUBLIC_BUILD_SERVICE_URL }}
          NEXT_PUBLIC_REAL_TIME_URL: ${{ secrets.NEXT_PUBLIC_REAL_TIME_URL }}
          NEXT_AUTH_URL: ${{ secrets.NEXT_AUTH_URL }}
        run: |
          echo "=== STEP 1: Current directory ==="
          pwd
          ls -la

          echo "=== STEP 2: Running build ==="
          npm run build

          echo "=== STEP 3: After build - directory contents ==="
          ls -la

          echo "=== STEP 4: Searching for any possible output folder ==="
          find . -maxdepth 2 -type d \( -name "out" -o -name "dist" -o -name "build" -o -name "public" -o -name ".next" \) | head -20

          echo "=== STEP 5: Checking package.json scripts ==="
          grep -A5 '"scripts"' package.json

          echo "=== STEP 6: Checking if next.config.js exists and its content ==="
          if [ -f next.config.js ]; then
            cat next.config.js
          else
            echo "next.config.js not found!"
          fi

          echo "=== STEP 7: Checking for any index.html files ==="
          find . -name "index.html" | head -10

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Meta-Factory-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
