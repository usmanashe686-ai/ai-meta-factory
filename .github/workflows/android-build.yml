name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Build Next.js static export
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_FLASK_URL: ${{ secrets.NEXT_PUBLIC_FLASK_URL }}
          NEXT_PUBLIC_BUILD_SERVICE_URL: ${{ secrets.NEXT_PUBLIC_BUILD_SERVICE_URL }}
          NEXT_PUBLIC_REAL_TIME_URL: ${{ secrets.NEXT_PUBLIC_REAL_TIME_URL }}
          NEXT_AUTH_URL: ${{ secrets.NEXT_AUTH_URL }}
        run: npm run build

      - name: Init & Add Android
        run: |
          npx cap init "AI Meta Factory" "com.aimetafactory.app2" --web-dir=out || true
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Clone llama.cpp (latest master)
        run: |
          git clone https://github.com/ggerganov/llama.cpp android/llama.cpp
          echo "✅ llama.cpp cloned (master)"

      - name: Restore native files and clean manifest
        run: |
          mkdir -p android/app/src/main/cpp
          cp -r native/android/cpp/* android/app/src/main/cpp/
          mkdir -p android/app/src/main/java/com/aimetafactory/llama
          cp -r native/android/java/com/aimetafactory/llama/* android/app/src/main/java/com/aimetafactory/llama/
          mkdir -p android/app/src/main/assets
          cp native/android/assets/capacitor.plugins.json android/app/src/main/assets/ 2>/dev/null || true
          mkdir -p android/app/src/main/java/com/aimetafactory/app
          cp native/android/MainActivity.patch android/app/src/main/java/com/aimetafactory/app/MainActivity.java
          cp native/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          echo "Native files restored"

      - name: Fix AndroidManifest permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "INTERNET" $MANIFEST || sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' $MANIFEST
          grep -q "FOREGROUND_SERVICE" $MANIFEST || sed -i '/<manifest/a \    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />' $MANIFEST
          grep -q "WRITE_EXTERNAL_STORAGE" $MANIFEST || sed -i '/<manifest/a \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' $MANIFEST

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Patch llama.cpp to conditionally compile sgemm.cpp using a CMake option
        run: |
          GGML_CMAKE="android/llama.cpp/ggml/src/CMakeLists.txt"
          # Remove the existing hardcoded sgemm.cpp line (if any)
          sed -i '/llamafile\/sgemm.cpp/d' "$GGML_CMAKE"
          # Add a conditional block that uses GGML_ARMV7_SAFE option
          cat >> "$GGML_CMAKE" << 'CMAKEPATCH'
          option(GGML_ARMV7_SAFE "Disable unsafe SIMD code for 32-bit ARM (sgemm.cpp)" OFF)
          if(NOT GGML_ARMV7_SAFE)
              target_sources(ggml-cpu PRIVATE ggml-cpu/llamafile/sgemm.cpp)
              message(STATUS "✅ sgemm.cpp enabled (GGML_ARMV7_SAFE=OFF)")
          else()
              message(STATUS "⚠️ ARMv7 SAFE MODE → skipping sgemm.cpp (GGML_ARMV7_SAFE=ON)")
          endif()
          CMAKEPATCH
          echo "✅ Patched CMakeLists.txt with GGML_ARMV7_SAFE option"

      - name: Build native library for both ABIs
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          mkdir -p $GITHUB_WORKSPACE/android/app/src/main/jniLibs
          
          for ABI in armeabi-v7a arm64-v8a; do
            echo "Building for $ABI"
            cd $GITHUB_WORKSPACE/android/app/src/main/cpp
            rm -rf build
            mkdir build && cd build
            
            # Flags for 32-bit: enable safe mode + disable FP16
            EXTRA_FLAGS=""
            if [ "$ABI" = "armeabi-v7a" ]; then
              EXTRA_FLAGS="-DGGML_ARMV7_SAFE=ON -DGGML_NO_F16=ON"
              echo "⚠️  ARMv7 safe mode enabled, FP16 disabled"
            fi
            
            cmake .. \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release \
              -DLLAMA_BUILD_EXAMPLES=OFF \
              -DLLAMA_BUILD_SERVER=OFF \
              -DLLAMA_BUILD_TESTS=OFF \
              -DLLAMA_BUILD_COMMON=OFF \
              $EXTRA_FLAGS
            
            make llama -j$(nproc)
            mkdir -p $GITHUB_WORKSPACE/android/app/src/main/jniLibs/$ABI
            find . -name "*.so" -exec cp {} $GITHUB_WORKSPACE/android/app/src/main/jniLibs/$ABI/ \;
            echo "✅ $ABI libraries copied"
          done

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build universal APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK contains native libraries
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            echo "APK size: $(du -h $APK)"
            unzip -l $APK | grep '\.so$' && echo "✅ Native libraries present"
            if unzip -l $APK | grep -q "armeabi-v7a.*\.so" && unzip -l $APK | grep -q "arm64-v8a.*\.so"; then
              echo "✅ Both armeabi-v7a and arm64-v8a libraries found"
            else
              echo "⚠️ Not both ABIs found – check build"
            fi
          else
            echo "APK not found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Meta-Factory-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
