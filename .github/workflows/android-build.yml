name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm install --legacy-peer-deps --no-audit

      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_FLASK_URL: ${{ secrets.NEXT_PUBLIC_FLASK_URL }}
          NEXT_PUBLIC_BUILD_SERVICE_URL: ${{ secrets.NEXT_PUBLIC_BUILD_SERVICE_URL }}
          NEXT_PUBLIC_REAL_TIME_URL: ${{ secrets.NEXT_PUBLIC_REAL_TIME_URL }}
          NEXT_AUTH_URL: ${{ secrets.NEXT_AUTH_URL }}

      - name: Init Android
        run: |
          npx cap init "AI Meta Factory" "com.aimetafactory.app" --web-dir=out || true
          rm -rf android
          npx cap add android
          npx cap sync android

      # ✅ SINGLE SOURCE OF TRUTH FOR ABI
      - name: Force ARM64 only
        run: |
          echo "android.defaultConfig.ndk.abiFilters=arm64-v8a" >> android/gradle.properties

      - name: Clone llama.cpp
        run: git clone --depth 1 https://github.com/ggerganov/llama.cpp android/llama.cpp

      - name: Restore native files
        run: |
          mkdir -p android/app/src/main/cpp
          cp -r native/android/cpp/* android/app/src/main/cpp/ || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Meta-Factory-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
