name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Build Next.js static export
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_FLASK_URL: ${{ secrets.NEXT_PUBLIC_FLASK_URL }}
          NEXT_PUBLIC_BUILD_SERVICE_URL: ${{ secrets.NEXT_PUBLIC_BUILD_SERVICE_URL }}
          NEXT_PUBLIC_REAL_TIME_URL: ${{ secrets.NEXT_PUBLIC_REAL_TIME_URL }}
          NEXT_AUTH_URL: ${{ secrets.NEXT_AUTH_URL }}
        run: npm run build

      - name: Init & Add Android
        run: |
          npx cap init "AI Meta Factory" "com.aimetafactory.app" --web-dir=out || true
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Force ARM64 ABI
        run: echo "android.defaultConfig.ndk.abiFilters=arm64-v8a" >> android/gradle.properties

      - name: Clone llama.cpp
        run: git clone --depth 1 https://github.com/ggerganov/llama.cpp android/llama.cpp

      - name: Restore native files
        run: |
          mkdir -p android/app/src/main/cpp
          cp -r native/android/cpp/* android/app/src/main/cpp/
          mkdir -p android/app/src/main/java/com/aimetafactory/llama
          cp -r native/android/java/com/aimetafactory/llama/* android/app/src/main/java/com/aimetafactory/llama/
          mkdir -p android/app/src/main/assets
          cp native/android/assets/capacitor.plugins.json android/app/src/main/assets/ 2>/dev/null || true
          cp native/android/MainActivity.patch android/app/src/main/java/com/aimetafactory/app/MainActivity.java

      - name: Fix AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:theme="[^"]*"//g' $MANIFEST
          sed -i "s/android:theme='[^']*'//g" $MANIFEST
          sed -i '/<uses-permission android:name="android.permission.INTERNET"\/>/d' $MANIFEST
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' $MANIFEST
          grep -q "FOREGROUND_SERVICE" $MANIFEST || \
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' $MANIFEST
          grep -q "DownloadService" $MANIFEST || \
            sed -i '/<\/application>/i \    <service android:name=".DownloadService" android:foregroundServiceType="dataSync" android:exported="false" />' $MANIFEST

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Force clean CMake build
        working-directory: ./android
        run: |
          rm -rf app/.cxx
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties

      # DEBUG: Show what files are in the cpp folder
      - name: Debug C++ sources
        run: |
          echo "=== C++ sources ==="
          ls -la android/app/src/main/cpp/
          echo "=== CMakeLists.txt content ==="
          cat android/app/src/main/cpp/CMakeLists.txt

      - name: Build native library with verbose output
        working-directory: ./android
        run: |
          ./gradlew :app:externalNativeBuildDebug --info

      - name: Verify .so files were created
        run: |
          echo "Searching for .so files in android folder:"
          find android -name "*.so" -type f
          if find android -name "*.so" | grep -q libllamabridge; then
            echo "✅ Native library found"
          else
            echo "❌ No .so files – native build failed"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build APK (ARM64 only)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK contains native library
        run: |
          APK=$(find android -name "app-debug.apk" | head -1)
          echo "APK size: $(du -h $APK)"
          unzip -l $APK | grep libllamabridge.so && echo "✅ Native library packaged" || { echo "❌ Native library missing from APK"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Meta-Factory-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
