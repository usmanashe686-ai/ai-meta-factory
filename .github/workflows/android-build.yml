name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Build Next.js static export
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_FLASK_URL: ${{ secrets.NEXT_PUBLIC_FLASK_URL }}
          NEXT_PUBLIC_BUILD_SERVICE_URL: ${{ secrets.NEXT_PUBLIC_BUILD_SERVICE_URL }}
          NEXT_PUBLIC_REAL_TIME_URL: ${{ secrets.NEXT_PUBLIC_REAL_TIME_URL }}
          NEXT_AUTH_URL: ${{ secrets.NEXT_AUTH_URL }}
        run: npm run build

      - name: Debug - List out folder
        run: |
          echo "Contents of out folder:"
          ls -la out/ || echo "out folder not found"

      - name: Debug - Show Capacitor config
        run: |
          echo "=== capacitor.config.js ==="
          cat capacitor.config.js || echo "File not found"
          echo "=== capacitor.config.ts (if exists) ==="
          cat capacitor.config.ts 2>/dev/null || echo "No .ts file"

      - name: Init & Add Android (Stable JS Path)
        run: |
          npx cap init "AI Meta Factory" "com.aimetafactory.app" --web-dir=out || true
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Setup llama.cpp native code
        run: |
          mkdir -p android/app/src/main/cpp
          cd android/app/src/main/cpp
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git llama
          cd ../../../../..
          cat > android/app/src/main/cpp/CMakeLists.txt << 'CMAKEEOF'
          cmake_minimum_required(VERSION 3.22)
          project("llama")
          set(CMAKE_CXX_STANDARD 17)
          add_subdirectory(llama)
          add_library(llama_jni SHARED llama_jni.cpp)
          target_link_libraries(llama_jni llama log)
          target_include_directories(llama_jni PRIVATE ${CMAKE_CURRENT_SOURCE_DIR}/llama)
          CMAKEEOF
          cat > android/app/src/main/cpp/llama_jni.cpp << 'JNICPP'
          #include <jni.h>
          #include <string>
          #include <android/log.h>
          #include "llama/llama.h"
          #define LOG_TAG "LlamaJNI"
          #define LOGD(...) __android_log_print(ANDROID_LOG_DEBUG, LOG_TAG, __VA_ARGS__)
          extern "C" JNIEXPORT jstring JNICALL Java_com_aimetafactory_app_LlamaBridge_runModel(JNIEnv *env, jobject, jstring modelPath, jstring prompt) {
              const char *model_path = env->GetStringUTFChars(modelPath, nullptr);
              const char *input = env->GetStringUTFChars(prompt, nullptr);
              LOGD("Model: %s, Prompt: %s", model_path, input);
              llama_backend_init();
              llama_model_params model_params = llama_model_default_params();
              model_params.n_gpu_layers = 0;
              llama_model *model = llama_load_model_from_file(model_path, model_params);
              if (!model) {
                  env->ReleaseStringUTFChars(modelPath, model_path);
                  env->ReleaseStringUTFChars(prompt, input);
                  llama_backend_free();
                  return env->NewStringUTF("Failed to load model");
              }
              llama_context_params ctx_params = llama_context_default_params();
              ctx_params.n_ctx = 512;
              llama_context *ctx = llama_new_context_with_model(model, ctx_params);
              if (!ctx) {
                  llama_free_model(model);
                  env->ReleaseStringUTFChars(modelPath, model_path);
                  env->ReleaseStringUTFChars(prompt, input);
                  llama_backend_free();
                  return env->NewStringUTF("Failed to create context");
              }
              // Tokenize and run a single inference (stub for simplicity)
              std::string result = "Model loaded and ready. Your prompt: " + std::string(input);
              llama_free(ctx);
              llama_free_model(model);
              llama_backend_free();
              env->ReleaseStringUTFChars(modelPath, model_path);
              env->ReleaseStringUTFChars(prompt, input);
              return env->NewStringUTF(result.c_str());
          }
          JNICPP
          mkdir -p android/app/src/main/java/com/aimetafactory/app
          cat > android/app/src/main/java/com/aimetafactory/app/LlamaBridge.java << 'JAVAEOF'
          package com.aimetafactory.app;
          public class LlamaBridge {
              static { System.loadLibrary("llama_jni"); }
              public static native String runModel(String modelPath, String prompt);
          }
          JAVAEOF
          cat > android/app/src/main/java/com/aimetafactory/app/MainActivity.java << 'MAINACT'
          package com.aimetafactory.app;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import android.webkit.WebView;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  registerPlugin(DownloadPlugin.class);
                  WebView webView = getBridge().getWebView();
                  webView.addJavascriptInterface(new LlamaBridge(), "LlamaBridge");
              }
          }
          MAINACT
          BUILD_GRADLE="android/app/build.gradle"
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/' $BUILD_GRADLE
          if ! grep -q "externalNativeBuild" $BUILD_GRADLE; then
            sed -i '/android {/a \    externalNativeBuild {\n        cmake {\n            path "src/main/cpp/CMakeLists.txt"\n        }\n    }\n    ndkVersion "26.3.11579264"' $BUILD_GRADLE
          fi

      - name: Patch AndroidManifest (fix theme, add permissions, etc.)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:theme="[^"]*"//g' $MANIFEST
          sed -i "s/android:theme='[^']*'//g" $MANIFEST
          sed -i '/<uses-permission android:name="android.permission.INTERNET"\/>/d' $MANIFEST
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' $MANIFEST
          grep -q "FOREGROUND_SERVICE" $MANIFEST || \
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' $MANIFEST
          grep -q "DownloadService" $MANIFEST || \
            sed -i '/<\/application>/i \    <service android:name=".DownloadService" android:foregroundServiceType="dataSync" android:exported="false" />' $MANIFEST

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Meta-Factory-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
