name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Build Next.js static export
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_FLASK_URL: ${{ secrets.NEXT_PUBLIC_FLASK_URL }}
          NEXT_PUBLIC_BUILD_SERVICE_URL: ${{ secrets.NEXT_PUBLIC_BUILD_SERVICE_URL }}
          NEXT_PUBLIC_REAL_TIME_URL: ${{ secrets.NEXT_PUBLIC_REAL_TIME_URL }}
          NEXT_AUTH_URL: ${{ secrets.NEXT_AUTH_URL }}
        run: npm run build

      - name: Init & Add Android
        run: |
          npx cap init "AI Meta Factory" "com.aimetafactory.app2" --web-dir=out || true
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Force ARM64 ABI
        run: echo "android.defaultConfig.ndk.abiFilters=arm64-v8a" >> android/gradle.properties

      - name: Clone llama.cpp (stable commit for 32‑bit)
        run: |
          git clone https://github.com/ggerganov/llama.cpp android/llama.cpp
          cd android/llama.cpp
          git checkout b3420

      - name: Restore native files (C++ + Java)
        run: |
          mkdir -p android/app/src/main/cpp
          cp -r native/android/cpp/* android/app/src/main/cpp/
          mkdir -p android/app/src/main/java/com/aimetafactory/llama
          cp -r native/android/java/com/aimetafactory/llama/* android/app/src/main/java/com/aimetafactory/llama/
          mkdir -p android/app/src/main/assets
          cp native/android/assets/capacitor.plugins.json android/app/src/main/assets/ 2>/dev/null || true
          # Use the MainActivity.patch that worked (the one from #334)
          mkdir -p android/app/src/main/java/com/aimetafactory/app
          cp native/android/MainActivity.patch android/app/src/main/java/com/aimetafactory/app/MainActivity.java
          # DO NOT copy a custom AndroidManifest – we'll patch the original one
          echo "Native files restored"

      - name: Fix AndroidManifest (only add missing permissions, keep original structure)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Remove duplicate INTERNET if any
          sed -i '/<uses-permission android:name="android.permission.INTERNET"\/>/d' $MANIFEST
          # Add a single INTERNET permission
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' $MANIFEST
          # Add other required permissions
          grep -q "FOREGROUND_SERVICE" $MANIFEST || \
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' $MANIFEST
          # Add DownloadService if missing
          grep -q "DownloadService" $MANIFEST || \
            sed -i '/<\/application>/i \    <service android:name=".DownloadService" android:foregroundServiceType="dataSync" android:exported="false" />' $MANIFEST

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Build native library (manual CMake) for both ABIs
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          mkdir -p $GITHUB_WORKSPACE/android/app/src/main/jniLibs
          for ABI in armeabi-v7a arm64-v8a; do
            echo "Building for $ABI"
            cd $GITHUB_WORKSPACE/android/app/src/main/cpp
            rm -rf build
            mkdir build && cd build
            cmake .. \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release \
              -DLLAMA_BUILD_EXAMPLES=OFF \
              -DLLAMA_BUILD_SERVER=OFF \
              -DLLAMA_BUILD_TESTS=OFF \
              -DLLAMA_BUILD_COMMON=OFF
            make llama -j$(nproc)
            mkdir -p $GITHUB_WORKSPACE/android/app/src/main/jniLibs/$ABI
            find . -name "*.so" -exec cp {} $GITHUB_WORKSPACE/android/app/src/main/jniLibs/$ABI/ \;
            echo "✅ $ABI libraries copied"
          done

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build APK (universal)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK contains native libraries
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            echo "APK size: $(du -h $APK)"
            unzip -l $APK | grep '\.so$' && echo "✅ Native libraries present"
          else
            echo "APK not found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Meta-Factory-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
