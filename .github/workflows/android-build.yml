name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Build Next.js static export
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_FLASK_URL: ${{ secrets.NEXT_PUBLIC_FLASK_URL }}
          NEXT_PUBLIC_BUILD_SERVICE_URL: ${{ secrets.NEXT_PUBLIC_BUILD_SERVICE_URL }}
          NEXT_PUBLIC_REAL_TIME_URL: ${{ secrets.NEXT_PUBLIC_REAL_TIME_URL }}
          NEXT_AUTH_URL: ${{ secrets.NEXT_AUTH_URL }}
        run: npm run build

      - name: Debug - List out folder
        run: |
          echo "Contents of out folder:"
          ls -la out/ || echo "out folder not found"

      - name: Debug - Show Capacitor config
        run: |
          echo "=== capacitor.config.js ==="
          cat capacitor.config.js || echo "File not found"
          echo "=== capacitor.config.ts (if exists) ==="
          cat capacitor.config.ts 2>/dev/null || echo "No .ts file"

      - name: Init & Add Android (Stable JS Path)
        run: |
          npx cap init "AI Meta Factory" "com.aimetafactory.app" --web-dir=out || true
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Fix AndroidManifest (remove activity theme, add permissions, fix duplicates)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:theme="[^"]*"//g' $MANIFEST
          sed -i "s/android:theme='[^']*'//g" $MANIFEST
          sed -i '/<uses-permission android:name="android.permission.INTERNET"\/>/d' $MANIFEST
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' $MANIFEST
          grep -q "FOREGROUND_SERVICE" $MANIFEST || \
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' $MANIFEST
          grep -q "DownloadService" $MANIFEST || \
            sed -i '/<\/application>/i \    <service android:name=".DownloadService" android:foregroundServiceType="dataSync" android:exported="false" />' $MANIFEST

      # ========== NEW: Add native llama.cpp build ==========
      - name: Clone llama.cpp for native inference
        run: |
          cd android
          git clone --depth 1 --branch master https://github.com/ggerganov/llama.cpp
          # The CMakeLists.txt expects llama.cpp at android/llama.cpp

      - name: Enable CMake build in app/build.gradle (if not already)
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          # Check if externalNativeBuild block exists
          if ! grep -q "externalNativeBuild" $BUILD_GRADLE; then
            echo "Adding CMake configuration to build.gradle"
            # Insert before the closing '}' of android block
            sed -i '/android {/a \    defaultConfig {\n        externalNativeBuild {\n            cmake {\n                cppFlags "-O2 -std=c++17"\n                arguments "-DANDROID_STL=c++_shared"\n            }\n        }\n    }\n    externalNativeBuild {\n        cmake {\n            path "src/main/cpp/CMakeLists.txt"\n            version "3.22.1"\n        }\n    }' $BUILD_GRADLE
          else
            echo "CMake already configured in build.gradle"
          fi

      # ========== End of new steps ==========

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Meta-Factory-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
