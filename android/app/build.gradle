
android {
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a"
            universalApk false
        }
    }
    defaultConfig {
        ndk {
        }
        ndk {
        }
        externalNativeBuild {
            cmake {
                cppFlags "-O2 -std=c++17"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file("$projectDir/src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}
