version: '3.8'

name: aimf-dev

networks:
  aimf-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:

services:
  # ------------------------------------------------------------
  # PostgreSQL – Primary Database
  # ------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: aimf-postgres
    restart: unless-stopped
    networks:
      - aimf-network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aimf
      POSTGRES_PASSWORD: aimf123
      POSTGRES_DB: aimf_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimf"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # Redis – Cache / Token Blacklist / Rate Limiting
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aimf-redis
    restart: unless-stopped
    networks:
      - aimf-network
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # MinIO – S3‑compatible Object Storage
  # ------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: aimf-minio
    restart: unless-stopped
    networks:
      - aimf-network
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_STORAGE_USE_HTTPS: false
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
